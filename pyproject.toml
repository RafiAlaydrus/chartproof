[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartproof"
version = "0.1.0"
description = "FHIR patient-record agent that cites its evidence and verifies its answers"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "litellm",
    "pandas",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    "tenacity",
    "pytest",
    "ruff",
    "matplotlib",
    "mcp",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
